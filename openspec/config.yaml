schema: spec-driven

context: |
  Project: cursiva — cursive-handwriting pedagogy web app.
  Instantiated stack (as of change scaffold-mvp-canvas, archived 2026-08-27):
    - Frontend client: React 19 + Vite 8 + TypeScript 7 (npm-workspaces monorepo, `client/` only)
    - Render: perfect-freehand; animation: framer-motion 13.x (design referenced 12 — pathLength API stable)
    - Backend/DB/Infra: NOT yet scaffolded (docs/06 deferred) — Node/Express/Postgres/SQLite/Docker planned later
  Canvas: normalized SVG viewBox (0 0 1000 600), Pointer Events API (getScreenCTM().inverse()),
    localStorage (key cursiva.progress.v1).
  Convention: docs are Spanish; technical SDD artifacts default to English.
  Source of truth: 7 main specs under openspec/specs/ (letter-model, trace-canvas, trace-validation,
    guided-trace-mode, free-trace-mode, progress-store, main-screen).

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  runner: vitest@4
  note: |
    Vitest 4 is the runner for the `client/` frontend (scaffold-mvp-canvas). `npm test` runs
    `vitest run`; `npm run build` = tsc --noEmit && vite build. 73 tests / 12 files green at
    archive. Strict TDD stays DISABLED (threat matrix N/A, no RED phase) per design. TS 7 bare
    `tsc --noEmit` has a known quirk — use `npm run build` instead. Backend runner not yet
    applicable (docs/06 deferred).
