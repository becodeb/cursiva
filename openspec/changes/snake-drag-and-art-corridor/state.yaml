  SPEC-PHASE FINDING: the task brief's list of "existing capability specs
  to delta" named `free-trace-mode` and `progress-store`. Neither is
  named in the proposal's own Modified Capabilities section (which names
  `guided-trace-mode`), and neither is touched by this change on
  inspection: `progress-store` is the per-letter store
  (`cursiva.progress.v1`), unrelated to `LevelProgressStore`
  (`cursiva.levels.v1`, itself specified inside `level-engine`, not
  `progress-store`); `free-trace-mode` owns `coverageScore`/erase-grid
  completion, which no snake level touches (`snake1..4` are `kind:
  'path'`, never `kind: 'free'`). The completion conjunction decision 4
  describes ("arrange gates tracing, completion becomes AND of both") is
  `guided-trace-mode`'s "Completion Handoff" requirement. Deltas were
  written against `guided-trace-mode`, per the proposal and the code, not
  against the two capabilities the brief named.

  SPECS RECONCILED AGAINST design.md §0 (2026-09-13, post-design pass).
  design.md landed after the six spec deltas and ratified seven
  amendments (A1-A7) that superseded decisions the specs still encoded.
  All six spec files were rewritten in place (not appended) to match
  what design.md commits to building:

  - level-engine: `enforceOrder` flipped from "false on snake1, true on
    snake2-4" to TRUE ON ALL FOUR (A3 - evaluateLevel scores accuracy
    against the UNION of all three bands, so without enforceOrder a
    child tracing only the small snake would score ~100 and be
    approved). Arc-length monotonicity narrowed from "non-decreasing
    across all four" to "non-decreasing within the three HORIZONTAL
    levels only, snake3 the named vertical outlier" (A7 - three oblique
    snakes don't fit the sheet at any scale that also clears the
    phase-1 span guard; three vertical ones fit at 0.72 scale, which
    shortens snake3's arc). Added a new requirement for
    `multiCorridorTick` (A2 - a REAL pre-existing defect:
    `corridorTick` reads `paths[0]` only via `buildLevel.ts:181`, so a
    three-path level's wall feedback was wrong on two of its three
    snakes; fixed by a delegating sibling, `corridorTick` itself
    untouched). Added the `toleranceFor` clamp note: every corridorWidth
    <=56 scores at an identical live tolerance, so `minAccuracy`'s
    strict increase, not corridorWidth, carries the narrowing.
    Confirmed (not just kept) the no-migration claim per A1, now stated
    as verified via grep over `LevelMap.tsx:81`.
  - guided-trace-mode: reworded the completion requirement from an "AND
    of two scores" framing to the accurate sequencing gate design.md
    §5.2 specifies - stroke evaluation is suppressed entirely while
    unarranged, not scored as a second pillar.
  - trace-canvas: REVERSED the channel decision. A6 found the sand DOES
    need a channel (`SAND_HOLLOW`, luma 52.5) because
    `TraceCanvas.tsx:1046` falls back to `SHEET_PAPER` with no channel,
    red by 42.8 - "no channel painted" was right about luma and wrong
    about mechanism. The luma law grew from 3 red rows to 4 (R1-R4, R2
    being the pre-existing SHEET_PAPER-vs-sand row, unedited) and
    `corridorArt` gained a third field, `headWhite`. Removed the
    standalone "Arrange Layer" render requirement entirely - design has
    no second render layer; the arrange pieces ARE the art-corridor
    images, repositioned live. Added a registry-completeness guard
    requirement (a real gap design found: the luma loop iterates two
    hand-listed groups, not the full registry, so a future backdrop
    silently escapes the law).
  - zoo-map: fixed "bosque alone stays fogged" to "bosque AND sendero"
    per design §7.1's own framing; added the structural reason (not
    just narrative) for no closingBeat.
  - art-corridor: renamed `snakeSpine`/`snakePlacement` to
    `spineWave`/`placeArtCorridor` per design's actual names, and
    replaced the "author independently, then measure drift" premise
    (which the ORIGINAL proposal built decision 2 on, and which the
    FIRST spec draft still encoded) with design's real mechanism: the
    generator's parameters are FITTED to 3 measured points per
    half-arch at build time, closed-form, so there is no independent
    geometry to drift in the first place. Added the C1-C6
    constraint-set requirement design §3.2 names directly.
  - object-arrange: REMOVED `useDragInput` entirely (A4 - the premise
    that useTraceInput allows only one stroke is false; `multiStroke`
    already ships and `LevelPlay.tsx:1323` passes it unconditionally;
    verified against source, both true). Replaced the "gated via
    useTraceInput's `enabled` option" framing with design's actual
    mechanism: `onFrame` redirects to `arrangeTick` and `onRelease`
    returns early while unarranged, pointer capture itself untouched
    throughout. Updated function signatures to match design's
    `initialArrange`/`grabPiece`/`arrangeTick`/`isArranged`/
    `debugArrange`, and added the ungated `?debug=ordenadas:<k>`
    requirement design §8 specifies.

  NO CONTRADICTION FOUND between design.md and docs/13 §8 row E's
  binding scope, or between design.md and the actual code. A2 and A4 -
  the two amendments a spec-level reconciliation most needed to trust -
  were independently verified against the working tree before rewriting
  any spec: `buildLevel.ts:181` does read `polyline` from `paths[0]`
  only; `useTraceInput.ts:104` does ship `multiStroke`, and
  `LevelPlay.tsx:1323` does pass it unconditionally. A7's choice of the
  VERTICAL branch over the oblique one is a valid reading of `docs/13`
  §2's own "orientación vertical u oblicua" (an "or"), not a scope
  departure.
