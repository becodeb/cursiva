  THE FINDING THAT DRIVES THE DESIGN: the author's black spots sit ON the
  body's midline, over up to 37 % of the traced columns. `INK_COLOR`
  (#1e293b, luma 40) against `#1a1a1a` (luma 26) separates 14 — it misses
  `docs/09` §4's 55-luma law by 41. A DARK INK ON A SNAKE IS UNDRAWABLE,
  the same class of finding as "montañitas bajas" in paso C.
  `TORCH_CHALK` (#f2efe6, luma 239, already shipped in `backdrops.ts`)
  clears the spots by 213 and the body by 99-117. The eye whites
  (#f5f5f5, luma 245) touch the spine for 1-3 % of columns at the head
  end, which is why the traceable span must END BEHIND THE HEAD.

  The snake's own body clears the sand by 69-87, so the corridor needs no
  painted channel under it — but a paper channel would MISS the law by 43
  (252 vs 209.2), so the snake backdrop row cannot resolve to
  `SHEET_PAPER` in `backdrops.test.ts`'s existing loop. Proposal decision
  3 restates the law rather than exempting the row.

  NO MIGRATION IS NEEDED, and this reverses the brief's working
  assumption. `snake1..4` APPEND after `night4` (the last phase-1 id) and
  demote nothing a real consumer reads: `isUnlocked` is positional but its
  only remaining consumer is `LevelMap.tsx:81`, the dev chrome — verified,
  and it is the same reading paso D's amendment A4 already ratified. Paso
  C is the precedent: it inserted eight ids ahead of all of phase 2 with
  no migration at all. `arena.unlockedWhen` moves from `alwaysClosed` to
  `isFiled(records,'night4')`, which only ever WIDENS access, so no
  returning child loses anything. `migrateEntrance.ts` is untouched.

