<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="cursiva — cursive handwriting practice canvas (scaffold)"
    />
    <title>cursiva</title>
    <!--
      The tab icon is the caretaker octopus. Without any icon link the browser
      asks for /favicon.ico on every load and logs a 404, which is noise in every
      browser check this repo runs.
    -->
    <link rel="icon" type="image/png" href="/art/zoo-octopus-caretaker.png" />
    <!--
      Typography lives HERE, at the document root, and not in `LAYOUT_CSS`.

      `LevelMap.tsx` and `MainScreen.tsx` style themselves with inline styles
      and never mount `LAYOUT_CSS`, so a family declared there reaches the play
      screen and leaves the map and the home screen in the UA default. Setting
      the family on `:root`/`body` is the only place that every screen
      inherits from, whatever it does about its own CSS.

      It must NOT be pushed down into components either: `PistasRail.tsx` is a
      deliberate no-font surface (D6 — the word PISTAS is drawn geometry, and
      its suite asserts no `font-family` appears in that component's own
      markup). An INHERITED family satisfies both: the rail's hidden label
      renders in Nunito like everything else, and the component still declares
      nothing.

      One variable file covers 400-900, so weight changes cost no extra
      download. `swap` means the child reads the screen immediately in a
      fallback rather than staring at invisible text on a slow classroom
      connection.
    -->
    <style>
      /* Global UA reset (adventure-flow-and-map-guidance T3, D2). LevelPlay's
         own `LAYOUT_CSS` already resets `html, body, #root` for the level
         screen, but that stylesheet only mounts while a level is showing —
         the prologue and the adventure-intro screens (`PrologueOpening.tsx`,
         `AdventureIntro.tsx`) never render it and carried the browser's own
         8px `body` margin instead: a visible white frame around their full-
         bleed `100dvh` art, and a page that scrolled 16px (8px top + 8px
         bottom) for no content of its own. `ZooMap.tsx` and
         `AdventureClosing.tsx` already carry this exact rule inline in their
         own per-screen stylesheets (see `AdventureClosing.test.tsx`'s pinned
         string) — this is the one place EVERY screen inherits from
         regardless of which one is mounted, so the two screens missing it
         stop being a special case instead of gaining a third copy. */
      html, body, #root {
        margin: 0;
        height: 100%;
      }

      @font-face {
        font-family: 'Nunito';
        src: url('/fonts/nunito.woff2') format('woff2-variations');
        font-weight: 400 900;
        font-style: normal;
        font-display: swap;
      }

      :root,
      body {
        font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
